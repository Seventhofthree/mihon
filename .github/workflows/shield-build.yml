name: Build Mihon Shield MVP
on:
  push:
    branches:
      - shield/mvp-0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .github/.java-version
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build Shield ARM64 APK
        run: ./gradlew assembleRelease -Pdist=ci -Pinclude-telemetry=false --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mihon-shield-mvp-arm64
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
